<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🤖amp</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }
        #webamp-container {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <div id="webamp-container"></div>

    <script src="webamp.bundle.min.js"></script>
    <script>
        // NOTE: gira su https://appassets.androidplatform.net/assets/webamp/
        // (dominio virtuale locale servito da WebViewAssetLoader), NON su file://
        // - Webamp usa fetch() per leggere il file .wsz e file:// gli da' problemi.
        var webamp = new Webamp({
            initialSkin: { url: "skins/base-2_91.wsz" },
            initialTracks: []
        });

        // Esposto su window per il bridge nativo Kotlin (DroidAmpAudioBridge,
        // Fase 2) e per debug da chrome://inspect.
        window.droidamp = webamp;

        // ------------------------------------------------------------------
        // FIT-TO-SCREEN (v2)
        //
        // Le finestre di Webamp (#main-window, #equalizer-window,
        // #playlist-window, e #webamp stesso) sono in "position: absolute"
        // -- e' cosi' che Webamp le rende trascinabili. Questo significa
        // che NON possiamo centrarle con un semplice calcolo manuale di
        // position:fixed + left/top (quello che avevamo prima), perche'
        // "position: absolute" ignora completamente i calcoli basati sul
        // flusso normale del documento.
        //
        // Soluzione: spostiamo il nodo reale dentro un contenitore
        // full-screen con "display:flex; align-items:center;
        // justify-content:center", e forziamo l'elemento a
        // "position:static" cosi' rientra nel flusso ed e' il flexbox del
        // genitore a centrarlo, non calcoli nostri. Poi scaliamo con
        // "zoom" (piu' affidabile di transform:scale per questo caso,
        // perche' il flex del genitore si ridimensiona di conseguenza
        // invece di dover ricalcolare manualmente la posizione).
        // ------------------------------------------------------------------
        window.droidampFitToScreen = function (selector) {
            var el = document.querySelector(selector);
            if (!el) return;

            el.style.zoom = "1";
            el.style.position = "static";
            el.style.top = "";
            el.style.left = "";
            el.style.margin = "0";

            var rect = el.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            var wrapperId = "droidamp-fit-wrapper";
            var wrapper = document.getElementById(wrapperId);
            if (!wrapper) {
                wrapper = document.createElement("div");
                wrapper.id = wrapperId;
                wrapper.style.position = "fixed";
                wrapper.style.top = "0";
                wrapper.style.left = "0";
                wrapper.style.width = "100vw";
                wrapper.style.height = "100vh";
                wrapper.style.display = "flex";
                wrapper.style.alignItems = "center";
                wrapper.style.justifyContent = "center";
                wrapper.style.overflow = "hidden";
                wrapper.style.zIndex = "9999";
                wrapper.style.background = "#000";
                document.body.appendChild(wrapper);
            }
            if (el.parentElement !== wrapper) {
                wrapper.appendChild(el);
            }

            var scale = Math.min(
                window.innerWidth / rect.width,
                window.innerHeight / rect.height
            ) * 0.98;
            el.style.zoom = String(scale);
        };

        window.addEventListener("resize", function () {
            if (window.__droidampFitSelector) {
                window.droidampFitToScreen(window.__droidampFitSelector);
            }
        });

        webamp.renderWhenReady(document.getElementById("webamp-container"));
    </script>
</body>
</html>
