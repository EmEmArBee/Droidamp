<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🤖amp</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: auto;
        }
        #webamp-container {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <div id="webamp-container"></div>

    <script src="webamp.bundle.min.js"></script>
    <script>
        var webamp = new Webamp({
            initialSkin: { url: "skins/base-2_91.wsz" },
            initialTracks: []
        });
        window.droidamp = webamp;
        webamp.renderWhenReady(document.getElementById("webamp-container"));

        // ------------------------------------------------------------------
        // FIT-TO-SCREEN (v3) - CSS "zoom", NIENTE position, NIENTE DOM move.
        //
        // Lezione imparata dai tentativi precedenti: le finestre Webamp
        // usano position:absolute anche per i loro controlli interni
        // (slider, bottoni). Qualsiasi cosa che cambi il "position" o
        // sposti il nodo altrove nel DOM rompe quel sistema di
        // riferimento. La proprieta' CSS "zoom" invece scala il layout
        // (non solo il rendering visivo, a differenza di transform) --
        // tutti i discendenti, inclusi quelli position:absolute, vengono
        // ricalcolati correttamente nel nuovo spazio scalato. Non tocchiamo
        // ne' position ne' la posizione nel DOM: solo "zoom".
        // ------------------------------------------------------------------
        window.droidampFitToScreen = function (selector) {
            var el = document.querySelector(selector);
            if (!el) return;
            el.style.zoom = "1";
            var rect = el.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            var scale = Math.min(
                window.innerWidth / rect.width,
                window.innerHeight / rect.height
            ) * 0.97;
            el.style.zoom = String(scale);
        };
    </script>
</body>
</html>
