<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🤖amp</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }
        #webamp-container {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <div id="webamp-container"></div>

    <script src="webamp.bundle.min.js"></script>
    <script>
        // NOTE: gira su https://appassets.androidplatform.net/assets/webamp/
        // (dominio virtuale locale servito da WebViewAssetLoader), NON su file://
        // - Webamp usa fetch() per leggere il file .wsz e file:// gli da' problemi.
        var webamp = new Webamp({
            initialSkin: { url: "skins/base-2_91.wsz" },
            initialTracks: []
        });

        // Esposto su window per il bridge nativo Kotlin (DroidAmpAudioBridge,
        // Fase 2) e per debug da chrome://inspect.
        window.droidamp = webamp;

        webamp.renderWhenReady(document.getElementById("webamp-container"));

        // NOTA: qui c'era un tentativo di scalare/centrare Webamp per
        // riempire lo schermo (droidampFitToScreen). L'ho tolto: le
        // finestre Webamp usano position:absolute anche INTERNAMENTE per i
        // controlli (slider, bottoni), e ogni tentativo di manipolarne il
        // position/transform da fuori ha finito per rompere quel sistema
        // di riferimento interno in modi imprevedibili. Meglio riprendere
        // questa cosa con calma in un secondo momento, con un approccio
        // piu' testato, invece di continuare a rattoppare. Per ora Webamp
        // resta alla sua dimensione naturale, centrato dal suo stesso
        // comportamento di default.
    </script>
</body>
</html>
